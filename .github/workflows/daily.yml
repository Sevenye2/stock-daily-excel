name: 股票日线

# 关于时间：GitHub 的 cron 只是"到点往队列里丢一张票"，这张票可能排很久队，
# 也可能被直接丢掉（官方文档原话：负载高时会延迟，负载足够高时部分排队任务会被丢弃）。
# 实测这个仓库 47 小时里本该醒 40 次，实际只醒了 3 次，而且时间完全随机。
#
# 所以这里不跟它较劲：每 20 分钟醒一次，**每次醒了都跑**，靠去重保证幂等——
#   · 已经有 (日期, 股票代码) 的数据会被跳过，所以跑一百次结果都一样
#   · 只有真的抓到新数据才写文件、才提交、才推送
# 效果：不管几点被叫醒，当天数据最迟在"下一次醒来"时补进表里，一天都不会缺。
# 想调安静时段（几点前不推送），改进脚本里的 QUIET_UNTIL（默认 08:00）。
on:
  schedule:
    - cron: '*/20 * * * 1-5'
  workflow_dispatch:
    inputs:
      days:
        description: '回溯天数（增量会去重，多取几天没坏处）'
        required: false
        default: '10'
      stocks:
        description: '临时指定股票代码，逗号分隔（留空则用仓库 Variables 的 STOCK_LIST）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: daily-excel
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v7

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install --quiet -r requirements.txt

      - name: 抓取日线并写入 Excel
        env:
          STOCK_LIST: ${{ github.event.inputs.stocks || vars.STOCK_LIST }}
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          QUIET_UNTIL: '08:00'
          TZ: Asia/Shanghai
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/baostock_daily_excel.py --days "${{ github.event.inputs.days || '10' }}"

      - name: 提交回仓库（这就是"增量"的持久化）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add excel/ data/ state/
          if git diff --cached --quiet -- excel data state; then
            echo "没有新增数据，跳过提交"
            exit 0
          fi
          # 两个坑，都在这里绕开：
          # 1) 提交里绝对不能带上 .github/workflows/* 的改动，否则会报
          #    "refusing to allow a GitHub App to create or update workflow ...
          #    without `workflows` permission"，GITHUB_TOKEN 永远拿不到这个权限。
          #    → 提交时显式限定路径：git commit ... -- excel data state
          # 2) xlsx 是二进制，两次运行撞车时 rebase 会停在冲突中间，接着 push 报
          #    fatal（exit 128）。→ 不做合并，改成"远端最新当基线，只叠本次数据"：
          #    --mixed 让 index 回到远端（工作区里本次生成的文件不动），
          #    再重新 add 这三个目录，提交自然只包含数据。
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --mixed FETCH_HEAD
          git add excel/ data/ state/
          if git diff --cached --quiet -- excel data state; then
            echo "本次结果与远端一致，无需提交"
            exit 0
          fi
          git commit -m "chore(excel): 更新股票日线 $(date +%F)" -- excel data state
          git push

      - name: 备份一份 Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-stock-excel
          path: |
            excel/
            data/
          retention-days: 30
          if-no-files-found: warn
