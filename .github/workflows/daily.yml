name: 股票日线

# 关于时间：GitHub 的 cron 是写死的字符串，不能用 Variables 拼；而且定时唤醒本身
# 就不准时（实测晚 30~40 分钟很常见，偶尔整次丢掉）。所以这里不指望"准点醒"，
# 改成"每 20 分钟醒一次 + 自己判断要不要跑"：
#   RUN_TIME（仓库变量，北京时间 HH:MM，默认 19:00）之前 → 跳过
#   今天已经跑过（state/last_run.txt 记着今天日期）→ 跳过
#   其余情况 → 执行。哪怕晚了两三个小时，只要当天还没跑就会补上；跑完写标记，当天不再重复。
# Baostock 通常 17:30 前后才更新完当日行情，别设太早；建议 08:00 ~ 22:00。
on:
  schedule:
    - cron: '*/20 * * * 1-5'
  workflow_dispatch:
    inputs:
      days:
        description: '回溯天数（增量会去重，多取几天没坏处）'
        required: false
        default: '10'
      stocks:
        description: '临时指定股票代码，逗号分隔（留空则用仓库 Variables 的 STOCK_LIST）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: daily-excel
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # gate 要读 state/last_run.txt，所以先拉仓库，再判断
      - name: 拉取仓库
        uses: actions/checkout@v7

      - name: 时间判断（北京时间，对照仓库变量 RUN_TIME）
        id: gate
        env:
          TARGET: ${{ vars.RUN_TIME || '19:00' }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "手动触发，跳过时间判断，直接执行"
            exit 0
          fi
          TARGET="${TARGET// /}"   # 容忍变量里多打空格
          if ! [[ "$TARGET" =~ ^[0-2][0-9]:[0-5][0-9]$ ]]; then
            echo "::error::变量 RUN_TIME='$TARGET' 格式不对，要写成 HH:MM，例如 19:00"
            exit 1
          fi
          TODAY=$(TZ=Asia/Shanghai date +%F)
          NOW=$(TZ=Asia/Shanghai date +%H:%M)
          if [ -f state/last_run.txt ] && [ "$(tr -d '[:space:]' < state/last_run.txt)" = "$TODAY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "现在 $NOW：今天 $TODAY 已经跑过了（state/last_run.txt），跳过这次唤醒"
            exit 0
          fi
          now_min=$((10#$(TZ=Asia/Shanghai date +%H) * 60 + 10#$(TZ=Asia/Shanghai date +%M)))
          tgt_min=$((10#${TARGET%%:*} * 60 + 10#${TARGET##*:}))
          if [ "$now_min" -lt "$tgt_min" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "现在 $NOW：还没到 $TARGET，跳过（每 20 分钟醒一次，到点后的那次会执行）"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "现在 $NOW：已过 $TARGET 且今天还没跑过，开始执行（迟到多久都补，当天只跑一次）"

      - name: 安装 Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 安装依赖
        if: steps.gate.outputs.run == 'true'
        run: pip install --quiet -r requirements.txt

      - name: 抓取日线并写入 Excel
        if: steps.gate.outputs.run == 'true'
        env:
          STOCK_LIST: ${{ github.event.inputs.stocks || vars.STOCK_LIST }}
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TZ: Asia/Shanghai
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/baostock_daily_excel.py --days "${{ github.event.inputs.days || '10' }}"

      - name: 提交回仓库（这就是"增量"的持久化）
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add excel/ state/
          if git diff --cached --quiet; then
            echo "没有新增数据，跳过提交"
            exit 0
          fi
          # xlsx 是二进制，两次运行撞车时 git 无法合并，rebase 会停在冲突中间，
          # 接着 git push 就报 fatal（exit 128）。所以这里不做合并：
          # 先把 HEAD 挪到远端最新（--soft 保留本次生成的文件），再把差异提交一次。
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --soft FETCH_HEAD
          if git diff --cached --quiet; then
            echo "本次结果与远端一致，无需提交"
            exit 0
          fi
          git commit -m "chore(excel): 更新股票日线 $(date +%F)"
          git push

      - name: 备份一份 Artifact
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: daily-stock-excel
          path: excel/
          retention-days: 30
          if-no-files-found: warn
